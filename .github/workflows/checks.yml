name: Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.3'

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.6.1

    - name: Build
      run: go build -v -o ./uniq

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.1

    - name: Unit tests
      run: go test -v ./...

    - name: Acceptance tests
      run: ./acceptance-tests/tests.sh
